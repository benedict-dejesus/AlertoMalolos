name: Update the board

# The board is refreshed every hour. A failed run never overwrites the board:
# the update writes state only after a successful cycle, and a source that is
# unavailable is logged and skipped.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/update-board.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alertomalolos-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the tests
        run: npm test

      - name: Check official sources and rebuild the board
        run: npm run update
        env:
          # Optional. When the City Information Office page token is set as a
          # repository secret, that source switches itself on; without it the
          # board simply uses the notices recorded in data/curated.json.
          MALOLOS_CIO_PAGE_TOKEN: ${{ secrets.MALOLOS_CIO_PAGE_TOKEN }}

      - name: Commit the new board state
        run: |
          git config user.name  "AlertoMalolos board"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/curated.json public
          if git diff --cached --quiet; then
            echo "No change to the board."
          else
            git commit -m "Board update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Keep the run log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
