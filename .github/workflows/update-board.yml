name: Update the board

# The board is refreshed every hour. A failed run never overwrites the board:
# the update writes state only after a successful cycle, and a source that is
# unavailable is logged and skipped.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/update-board.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alertomalolos-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      health: ${{ steps.health.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the tests
        run: npm test

      - name: Check official sources and rebuild the board
        run: npm run update
        env:
          # Optional. When an office's page token is set as a repository secret,
          # that source switches itself on; without it the board simply uses the
          # notices recorded in data/curated.json.
          MALOLOS_CIO_PAGE_TOKEN: ${{ secrets.MALOLOS_CIO_PAGE_TOKEN }}
          BULACAN_PDRRMO_PAGE_TOKEN: ${{ secrets.BULACAN_PDRRMO_PAGE_TOKEN }}

      - name: Commit the new board state
        run: |
          git config user.name  "AlertoMalolos board"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/curated.json public
          if git diff --cached --quiet; then
            echo "No change to the board."
            exit 0
          fi
          git commit -m "Board update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # A notice recorded by hand, or any other push, can land while this run
          # is working. Losing an hour of updates to that race is avoidable:
          # rebase onto whatever arrived and try again.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the branch."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((attempt * 5))
          done
          echo "Could not push the board update after 3 attempts." >&2
          exit 1

      # A broken source must never stop a good board from going out, so this step
      # cannot fail the job - the verdict is carried to the `health` job below,
      # which turns the run red without touching the deploy. The city website
      # spent 17 runs pointing at a domain that does not resolve and nothing ever
      # said so; that is the failure this closes.
      - name: Report source health
        id: health
        continue-on-error: true
        run: node tools/source-health.js

      - name: Keep the run log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs after the deploy, so a broken source is reported without ever delaying
  # the board. Its only job is to make the run fail, which is what sends the
  # notification. Read the "Source health" table on the run summary to see which
  # source it is.
  health:
    needs: [update, deploy]
    if: always() && needs.update.outputs.health == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "One or more sources could not be retrieved. See the Source health" >&2
          echo "table on this run's summary, then fix the URL in config/sources.js" >&2
          echo "or switch the source off with a disabledReason." >&2
          exit 1
